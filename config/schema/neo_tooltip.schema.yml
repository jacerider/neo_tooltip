neo_tooltip.settings:
  type: neo_tooltip
  mapping:
    _core:
      # Added by the config installer; only exists for merging config.
      requiredKey: false
      type: _core_config_info

# Required by neo_settings.schema.yml, which resolves a variation's stored
# settings via `type: neo_settings.settings.[%parent.plugin]`.
neo_settings.settings.neo_tooltip:
  type: neo_tooltip

neo_tooltip:
  type: mapping
  mapping:
    placement:
      type: string
      label: Placement
    animation:
      type: string
      label: Animation
    trigger:
      type: string
      label: Trigger
    color:
      type: string
      label: Color
